name: FraMCit
version: '1.1.0'
main: com.dasannn.framcit.FraMCitPlugin
api-version: '26.3'
description: Imagenes y GIFs en marcos de Minecraft

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false

permissions:
  framcit.imagen:
    description: Permite usar /imagen para convertir una URL en un mapa
    default: false
  framcit.admin:
    description: Permisos de administracion de FraMCit
    default: false
    children:
      framcit.imagen: true
  framcit.gratis:
    description: Permite crear imagenes sin pagar
    default: false
  framcit.slots.1:
    description: Permite poseer hasta 1 imagen
    default: false
  framcit.slots.2:
    description: Permite poseer hasta 2 imagenes
    default: false
  framcit.slots.3:
    description: Permite poseer hasta 3 imagenes
    default: false
  framcit.slots.ilimitado:
    description: Permite poseer imagenes sin limite de cupo
    default: op
  framcit.frames.10:
    description: Permite imagenes de hasta 10 frames
    default: false
  framcit.frames.25:
    description: Permite imagenes de hasta 25 frames
    default: false
  framcit.frames.50:
    description: Permite imagenes de hasta 50 frames
    default: false
  framcit.frames.100:
    description: Permite imagenes de hasta 100 frames
    default: false
