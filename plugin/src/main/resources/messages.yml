# =====================================================================
# FraMCit - Archivo de mensajes
# =====================================================================
# Todos los mensajes del plugin mostrados en chat a jugadores y administradores.
# Soporta variables según el mensaje (por ejemplo: {code}, {frames}, {id}, {url}, etc.)
