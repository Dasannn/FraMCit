name: Sign FraMCit release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sign-release-jar:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Sign the release JAR with the pinned Ed25519 key
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMCIT_ED25519_PRIVATE_KEY: ${{ secrets.FRAMCIT_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FRAMCIT_ED25519_PRIVATE_KEY" ]]; then
            echo "Missing environment secret FRAMCIT_ED25519_PRIVATE_KEY" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"

          asset="FraMCit-${version}.jar"
          signature="${asset}.sig"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          printf '%s\n' "$FRAMCIT_ED25519_PRIVATE_KEY" > "$workdir/private.pem"
          chmod 600 "$workdir/private.pem"
          gh api "repos/$REPOSITORY/contents/plugin/src/main/resources/framcit-update-public-key.pem?ref=$DEFAULT_BRANCH" \
            --jq .content | base64 --decode > "$workdir/pinned-public.pem"
          openssl pkey -in "$workdir/private.pem" -pubout -out "$workdir/public.pem"
          cmp "$workdir/public.pem" "$workdir/pinned-public.pem"

          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern "$asset" --dir "$workdir"
          test -s "$workdir/$asset"
          openssl pkeyutl -sign -rawin -inkey "$workdir/private.pem" \
            -in "$workdir/$asset" -out "$workdir/$signature"
          test "$(wc -c < "$workdir/$signature")" -eq 64
          gh release upload "$RELEASE_TAG" "$workdir/$signature" --repo "$REPOSITORY" --clobber
